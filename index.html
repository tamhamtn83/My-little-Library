<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Increase button</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik+Spray+Paint&display=swap" rel="stylesheet">
</head>
<body>
    <header class="container">
        <div>
            <h1 class="thumbnail">My Little Library</h1>
        </div>
    </header>
    <main class="main container">
        <div id="add_book">
            <button class="add_btn" id="add_btn">+Add Book</button>
        </div>
        <div class="bookgrids" id="booksgrids">
        </div>
    </main>
    <div id="modal">
        <div>
            <form class="form" >
                <h3> Add your book </h3>
                <input class="input" id="name" placeholder="Name" type="text" autocomplete="off">
                <input class="input" id="author" placeholder="Author" autocomplete="off" type="text">
                <input class="input" id="pages" placeholder="Pages" autocomplete="off" type="number">
                <div>
                    <label for="isread">Have you read it?</label>
                    <input type="checkbox" class="checkbox" id="isread">
                </div>
                <div>
                    <button type="submit" class="button" id="addbtn">Add book</button>     
                </div>
                
            </form>
        </div>
    </div>
</body>
</html>
